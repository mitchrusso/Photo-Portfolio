name: Website template control matrix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-template-controls-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-template-controls:
    name: Verify all template controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify every left-menu control in every website template
        run: npm run test:website-templates
