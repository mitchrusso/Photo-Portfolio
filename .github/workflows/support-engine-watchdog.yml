name: PhotoView support engine watchdog

on:
  schedule:
    - cron: "3,18,33,48 * * * *"

concurrency:
  group: photoview-support-engine-watchdog
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Run the independent support check
        run: |
          set -euo pipefail
          identity=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=photoview-support-watchdog" | jq -er '.value')
          echo "::add-mask::$identity"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $identity" \
            https://photoview.io/api/support/watchdog >/dev/null
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            https://photoview.io/api/support/health >/dev/null
